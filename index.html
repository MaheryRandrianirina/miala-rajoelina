<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rajoelina-promises-countdown/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Year Countdown</title>
    <script type="module" crossorigin src="/rajoelina-promises-countdown/assets/index-PmCmnDfz.js"></script>
    <link rel="stylesheet" crossorigin href="/rajoelina-promises-countdown/assets/index-bYCzWydX.css">
  </head>
  <body>
    <div id="app">
      <div class="countdown-container">
        <h1 class="title">HOFOANA NY DELESTAGE NY 6 OKTOBRA 2026</h1>
        <p class="message">Sao dia heverinao fa hadinonay ?</p>
        <div class="countdown">
          <div class="time-unit">
            <span class="time-value" id="days">0</span>
            <span class="time-label">Andro</span>
          </div>
          <div class="time-unit">
            <span class="time-value" id="hours">0</span>
            <span class="time-label">Ora</span>
          </div>
          <div class="time-unit">
            <span class="time-value" id="minutes">0</span>
            <span class="time-label">Minitra</span>
          </div>
          <div class="time-unit">
            <span class="time-value" id="seconds">0</span>
            <span class="time-label">Segondra</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
